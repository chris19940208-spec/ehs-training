<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>安全衛生闖關</title>
<meta name="description" content="在 DNN 3F 展示間裡走一圈，闖過 9 關學會一般安全衛生教育訓練的重點。">
<link rel="icon" href="assets/dnn-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed first-person walk through the 3F showroom; a mission panel docks right on desktop
   and becomes a bottom sheet on phones; each stage opens as a centred dialog over the scene. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f5fb; --fg:#12152b; --muted:#5e6a8a; --line:#e2e6f1;
  --accent:#4a6cf7; --accent-ink:#ffffff; --violet:#7c5cf0; --scene:#e8ecf5;
  --ok:#14915f; --ok-bg:#e6f6ef; --bad:#c2352b; --bad-bg:#fdecea; --amber:#b86e00; --amber-bg:#fff4e0;
  --shadow:0 10px 30px rgba(18,21,43,.12);
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08080f; --surface:#12121f; --surface-2:#1b1b33; --fg:#e8e8f2; --muted:#8c96b8; --line:#2a2a52;
  --accent:#6f8bff; --accent-ink:#08080f; --violet:#a78bfa; --scene:#0d0d18;
  --ok:#3ccf8e; --ok-bg:#0f2a20; --bad:#ff7a70; --bad-bg:#33161a; --amber:#f5b041; --amber-bg:#2e220c;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08080f; --surface:#12121f; --surface-2:#1b1b33; --fg:#e8e8f2; --muted:#8c96b8; --line:#2a2a52;
  --accent:#6f8bff; --accent-ink:#08080f; --violet:#a78bfa; --scene:#0d0d18;
  --ok:#3ccf8e; --ok-bg:#0f2a20; --bad:#ff7a70; --bad-bg:#33161a; --amber:#f5b041; --amber-bg:#2e220c;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#app{position:relative;height:100%;overflow:hidden;background:var(--scene)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.tag .lbl{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font:700 14px/1.3 var(--sans);white-space:nowrap;box-shadow:var(--shadow)}
.tag .lbl b{font:700 12px/1 var(--mono);color:var(--accent);margin-right:6px}
.tag .stem{width:2px;height:18px;background:var(--accent);border-radius:1px}
.tag.done .lbl{color:var(--ok)} .tag.done .stem{background:var(--ok)}
.tag.found .lbl{background:var(--ok);color:#fff;border-color:var(--ok)} .tag.found .stem{background:var(--ok)}

#ui{position:absolute;inset:0;pointer-events:none;padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
#ui > *{pointer-events:auto}
.brand{grid-column:1;grid-row:1;align-self:start;justify-self:start;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:26px;width:auto}
.eyebrow{font:500 13px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:2px 0 0;font:700 19px/1.3 var(--sans)}
.score{display:flex;flex-direction:column;align-items:flex-end;padding-left:14px;border-left:1px solid var(--line)}
.score b{font:700 20px/1.1 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}

#panel{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card .eyebrow{color:var(--accent)}
.card h2{margin:0;font:900 30px/1.2 var(--sans);text-wrap:balance}
.card p{margin:0;font:400 16px/1.7 var(--sans)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .6s var(--ease)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;
  font:500 16px/1 var(--sans);padding:12px 16px;cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease),transform .2s var(--ease)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,#list button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.near{display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font:500 15px/1.4 var(--sans)}
.near.on{display:flex}
kbd{font:700 12px/1 var(--mono);border:1px solid currentColor;border-radius:5px;padding:3px 6px}

#list{list-style:none;margin:0;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
#list button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;
  padding:9px 12px;color:var(--fg);font:500 15px/1.4 var(--sans);text-align:left;cursor:pointer}
#list button:hover:not([disabled]){background:var(--surface-2)}
#list button[disabled]{color:var(--muted);cursor:default}
#list button[aria-current="true"]{background:var(--surface-2);color:var(--accent);font-weight:700}
#list .n{font:500 12px/1 var(--mono);color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
#list .st{margin-left:auto;font:700 13px/1 var(--mono);color:var(--muted);white-space:nowrap}
#list .st.done{color:var(--ok)}

#hint{grid-column:1;grid-row:2;align-self:start;justify-self:center;max-width:min(560px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;font:400 15px/1.5 var(--sans);color:var(--muted);box-shadow:var(--shadow);text-align:center}
#hint b{color:var(--fg)}
#hint.hunt{border-color:var(--amber);color:var(--fg)}
#controls{grid-column:1;grid-row:3;justify-self:start;align-self:end;display:flex;gap:6px;padding:4px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#controls .btn{border:0;background:none;padding:10px 12px;font-size:15px}
#controls .sm{display:none}
#pad{grid-column:1;grid-row:3;justify-self:end;align-self:end;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
#pad button{border-radius:12px;font:700 18px/1 var(--mono);padding:0;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface);box-shadow:var(--shadow)}
#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}

#toast{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  max-width:min(520px,calc(100% - 32px));background:var(--surface);border:1px solid var(--ok);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);
  transition:opacity .35s var(--ease),transform .35s var(--ease);z-index:6}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;color:var(--ok);font:700 16px/1.4 var(--sans)}
#toast span{font:400 15px/1.6 var(--sans)}

/* overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:8;padding:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:color-mix(in srgb, var(--scene) 55%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dialog{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:16px}
.dialog h2{margin:0;font:900 30px/1.25 var(--sans);text-wrap:balance}
.dialog h3{margin:0;font:700 20px/1.5 var(--sans);text-wrap:balance}
.dialog p{margin:0;font:400 17px/1.75 var(--sans)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--surface-2)}
.dots i.cur{background:var(--accent)} .dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:14px 16px;
  font:500 17px/1.5 var(--sans);cursor:pointer;display:flex;gap:12px;align-items:baseline;transition:border-color .25s var(--ease),background .25s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:700 13px/1 var(--mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--surface-2)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:14px 16px;font:400 16px/1.7 var(--sans)}
.fb b{display:block;font:700 17px/1.5 var(--sans);margin-bottom:2px}
.fb.ok{background:var(--ok-bg)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-bg)} .fb.bad b{color:var(--bad)}
.fb .list{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fb .list b{display:inline;font-size:16px;margin-right:6px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px 14px;font:500 16px/1.4 var(--sans);cursor:pointer;text-align:left}
.chip:hover:not([disabled]){border-color:var(--accent)}
.chip[disabled]{opacity:.35;cursor:default}
.seq{list-style:none;margin:0;padding:12px;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px;min-height:56px;counter-reset:s}
.seq li{counter-increment:s}
.seq li button{width:100%;display:flex;gap:10px;align-items:baseline;appearance:none;border:0;background:var(--surface-2);color:var(--fg);border-radius:8px;padding:9px 12px;font:500 16px/1.4 var(--sans);cursor:pointer;text-align:left}
.seq li button::before{content:counter(s,decimal-leading-zero);font:700 12px/1 var(--mono);color:var(--accent)}
.seq.ok li button{background:var(--ok-bg)} .seq.bad li button{background:var(--bad-bg)}
.seq .empty{font:400 15px/1.5 var(--sans);color:var(--muted);padding:6px 4px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .chip{width:100%}
.match .chip.sel{border-color:var(--accent);background:var(--surface)}
.match .chip.paired{border-color:var(--violet)}
.match .chip.right{border-color:var(--ok);background:var(--ok-bg)} .match .chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.match .chip.right[disabled],.match .chip.wrong[disabled]{opacity:1}
.chip small{display:block;font:500 12px/1.3 var(--mono);color:var(--violet);margin-top:2px}
.rhythm{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.press{width:160px;height:160px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:900 24px/1.2 var(--sans);cursor:pointer;
  box-shadow:0 12px 30px color-mix(in srgb, var(--accent) 40%, transparent);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s ease}
.press.hit{transform:scale(.92)}
.press[disabled]{opacity:.5;cursor:default}
.gauge{position:relative;width:100%;height:36px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ok-bg);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.gauge .needle{position:absolute;top:4px;bottom:4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--fg);transition:left .2s var(--ease)}
.gauge .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px 2px;font:500 11px/1 var(--mono);color:var(--muted)}
.bpm{font:700 28px/1 var(--mono);font-variant-numeric:tabular-nums}
.bpm small{font:500 14px/1 var(--sans);color:var(--muted);margin-left:6px}
.stars{display:flex;gap:6px;font-size:34px;line-height:1;color:var(--amber)}
.stars .off{color:var(--line)}
.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.result div{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center}
.result b{display:block;font:700 24px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.result span{font:400 13px/1.4 var(--sans);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 15px/1.4 var(--sans);color:var(--muted)}
.field input{font:500 17px/1.4 var(--sans);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.field input:focus{outline:none;border-color:var(--accent)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font:400 15px/1.5 var(--sans);color:var(--muted);align-items:center}
.keys span:nth-child(odd){font:700 13px/1 var(--mono);color:var(--fg);white-space:nowrap}
.load{display:flex;flex-direction:column;gap:8px}
.load .meter{height:6px}
.load .msg{font:400 15px/1.5 var(--sans);color:var(--muted)}
.cert img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.small{font:400 14px/1.6 var(--sans);color:var(--muted)}

/* 手機：上方一條標題列、下方一條任務列，中間留給 3D 場景 */
@media (max-width:760px){
  #ui{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:6px;padding-block:8px;
    padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
  .brand{grid-column:1;grid-row:1;padding:5px 10px;gap:8px;border-radius:10px;box-shadow:none}
  .brand img{height:14px}
  .brand h1{font-size:14px;margin:0}
  .brand .eyebrow{display:none}
  .score{padding-left:8px;flex-direction:row;align-items:baseline;gap:3px}
  .score b{font-size:14px}
  .score .eyebrow{display:inline;font-size:11px;letter-spacing:0}
  #controls{grid-column:2;grid-row:1;align-self:start;padding:2px;gap:0;border-radius:10px;box-shadow:none}
  #controls .btn{padding:6px 8px;font-size:13px}
  #controls .lg{display:none} #controls .sm{display:inline}
  .brand h1{white-space:nowrap}
  #hint{grid-column:1 / -1;grid-row:2;font-size:12px;line-height:1.45;padding:5px 10px;border-radius:8px;box-shadow:none;max-width:100%}
  #pad{grid-column:1 / -1;grid-row:4;justify-self:end;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}
  #pad button{font-size:14px;border-radius:10px;opacity:.88;box-shadow:none}
  #panel{grid-column:1 / -1;grid-row:5;gap:6px}
  #list{display:none}
  .card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:12px;box-shadow:none}
  .card .eyebrow,.card p,.card .near{display:none}
  .card h2{grid-column:1;grid-row:1;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .row{grid-column:2;grid-row:1;flex-wrap:nowrap;gap:6px}
  .card .row .btn{padding:7px 10px;font-size:13px;border-radius:8px}
  .card .meter{grid-column:1 / -1;grid-row:2;height:3px}
  .tag .lbl{font-size:11px;padding:2px 8px}
  .tag .lbl b{font-size:10px;margin-right:4px}
  .tag .stem{height:10px}
  #toast{padding:8px 12px;border-radius:10px;bottom:calc(env(safe-area-inset-bottom, 0px) + 70px)}
  #toast b{font-size:13px} #toast span{font-size:12px;line-height:1.5}
  .overlay{padding:10px;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px))}
  .dialog{padding:16px;gap:10px;border-radius:14px}
  .dialog h2{font-size:19px}
  .dialog h3{font-size:16px;line-height:1.45}
  .dialog p{font-size:14px;line-height:1.65}
  .eyebrow{font-size:11px}
  .small{font-size:12px}
  .dots i{width:20px;height:4px}
  .opts{gap:6px}
  .opt{font-size:14px;padding:9px 12px;border-radius:10px;gap:8px}
  .fb{padding:10px 12px;font-size:13px;line-height:1.6;border-radius:10px}
  .fb b{font-size:14px}
  .fb .list b{font-size:13px}
  .btn{font-size:14px;padding:9px 13px}
  .chips{gap:6px}
  .chip{font-size:13px;padding:7px 10px;border-radius:8px}
  .seq{padding:8px;gap:4px;min-height:40px}
  .seq li button{font-size:13px;padding:6px 10px}
  .match{gap:6px} .match .col{gap:6px}
  .rhythm{gap:8px;padding:0}
  .press{width:104px;height:104px;font-size:18px}
  .gauge{height:28px}
  .bpm{font-size:22px}
  .stars{font-size:24px}
  .result{gap:6px} .result div{padding:8px} .result b{font-size:18px} .result span{font-size:11px}
  .field input{font-size:16px;padding:9px 12px}
  .keys{font-size:13px;gap:4px 10px}
  .keys span:nth-child(odd){font-size:11px}
}
/* 手機橫放：右側窄面板 */
@media (min-width:761px) and (max-height:500px){
  #ui{grid-template-columns:minmax(0,1fr) 230px;gap:8px;padding-block:8px}
  .brand{padding:5px 10px;gap:8px}
  .brand img{height:14px} .brand h1{font-size:14px;margin:0} .brand .eyebrow{display:none} .score b{font-size:14px}
  .card{padding:10px;gap:6px} .card .eyebrow{font-size:11px} .card h2{font-size:16px} .card p{display:none}
  .card .btn{padding:7px 10px;font-size:13px}
  #list{padding:4px} #list button{padding:5px 8px;font-size:12px}
  #hint{font-size:12px;padding:5px 10px}
  #controls .btn{padding:6px 8px;font-size:12px}
  #pad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,40px);gap:4px}
  .dialog{padding:14px;gap:8px} .dialog h2{font-size:18px} .dialog h3{font-size:15px} .dialog p{font-size:13px}
  .opt{font-size:13px;padding:7px 10px} .press{width:90px;height:90px;font-size:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="DNN 3F 展示間 3D 場景"></canvas>
  <div id="pins" aria-hidden="true"></div>
  <div id="ui" hidden>
    <header class="brand">
      <img src="assets/dnn-logo.webp" alt="DNN Technology" width="69" height="26">
      <div>
        <div class="eyebrow">Safety Quest · 3F Showroom</div>
        <h1>安全衛生闖關</h1>
      </div>
      <div class="score"><b id="score">0</b><span class="eyebrow">分</span></div>
    </header>
    <aside id="panel" aria-label="闖關任務">
      <section class="card" aria-live="polite">
        <div class="eyebrow" id="stageEn">Stage 01 / The Law</div>
        <h2 id="stageTitle">法規基本功</h2>
        <p id="stageDesc"></p>
        <div class="meter" aria-hidden="true"><i id="prog"></i></div>
        <div class="near" id="near"><kbd>E</kbd><span>已抵達站點，開始關卡</span></div>
        <div class="row">
          <button class="btn primary" id="startStage" type="button">開始關卡</button>
          <button class="btn" id="goStage" type="button">自動前往</button>
        </div>
      </section>
      <ol id="list"></ol>
    </aside>
    <div id="hint"></div>
    <div id="controls" role="group" aria-label="設定">
      <button class="btn" id="btnHelp" type="button"><span class="lg">操作說明</span><span class="sm">說明</span></button>
      <button class="btn" id="btnReset" type="button"><span class="lg">重新開始</span><span class="sm">重來</span></button>
    </div>
    <div id="pad" hidden>
      <button class="btn up" data-k="f" type="button" aria-label="前進">▲</button>
      <button class="btn left" data-k="l" type="button" aria-label="向左轉">◀</button>
      <button class="btn down" data-k="b" type="button" aria-label="後退">▼</button>
      <button class="btn right" data-k="r" type="button" aria-label="向右轉">▶</button>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
